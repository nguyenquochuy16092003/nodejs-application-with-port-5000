version: 0.0
os: linux
files:
  - source: /
    destination: /opt/node-app
hooks:
  ApplicationStop:
    - location: scripts/01.application_stop.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/02.after_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/03.application_start.sh
      timeout: 30
      runas: root
  ValidateService:
    - location: scripts/04.validate_service.sh
      timeout: 30
      runas: root